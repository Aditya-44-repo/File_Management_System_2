<div class="forgot-password-page">
  <mat-card class="auth-card">
    <div class="form-container">
      <div class="brand">
        <img class="brand-logo" src="assets/docit-logo.png" alt="DocIT logo" />
      </div>

      <h2>Forgot password</h2>
      <p class="subtitle">Enter your email to receive a reset link</p>

      <div *ngIf="!emailSent">
        <form [formGroup]="form" (ngSubmit)="submit()">
          <label class="input-label">Email Address</label>
          <mat-form-field appearance="outline" class="full">
            <mat-icon matPrefix>mail</mat-icon>
            <input matInput type="email" formControlName="email" placeholder="Enter your email" />
            <mat-error *ngIf="form.controls.email.hasError('required')">Email is required</mat-error>
            <mat-error *ngIf="form.controls.email.hasError('email')">Please enter a valid email</mat-error>
          </mat-form-field>

          <button mat-raised-button color="primary" type="submit" class="submit-btn" [disabled]="loading || form.invalid">
            {{ loading ? 'Sending…' : 'Send Reset Link' }}
          </button>
        </form>
      </div>

      <div *ngIf="emailSent" class="success-container">
        <mat-icon class="success-icon">mark_email_read</mat-icon>
        <h3>Check Your Email</h3>
        <p>We've sent a password reset link to <strong>{{ sentEmail }}</strong></p>
        <p class="info-text">The link will expire in 24 hours.</p>
        <p class="check-spam">Didn't receive the email? Check your spam folder or <a href="javascript:void(0)" (click)="resendEmail()">resend the link</a></p>
      </div>

      <div class="actions">
        <button mat-stroked-button type="button" (click)="backToLogin()">Back to Login</button>
      </div>
    </div>
  </mat-card>
</div>
