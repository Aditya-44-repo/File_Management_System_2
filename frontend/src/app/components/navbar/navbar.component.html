<mat-toolbar color="primary" class="navbar">
  <!-- Hamburger icon for mobile -->
  <button mat-icon-button class="hamburger" [matMenuTriggerFor]="mobileMenu" *ngIf="!isLoggedIn">
    <mat-icon>menu</mat-icon>
  </button>
  <!-- Logo -->
  <a routerLink="/home" class="brand" aria-label="DocIT Home">
    <span class="brand-text">DocIT</span>
  </a>
  <span class="spacer"></span>
  <!-- Desktop nav buttons (hidden on mobile) -->
  <div class="desktop-nav" *ngIf="!isLoggedIn">
    <button mat-button routerLink="/login">Login</button>
    <button mat-button routerLink="/register">Register</button>
  </div>
  <!-- Profile button on right (shown when logged in) -->
  <ng-container *ngIf="isLoggedIn">
    <button mat-icon-button class="profile-menu-btn" (click)="openProfileDialog()">
      <img [src]="profileImage" alt="Profile" class="profile-avatar" (error)="handleProfileImageError()">
    </button>
  </ng-container>
</mat-toolbar>

<!-- Mobile dropdown menu (only when not logged in) -->
<mat-menu #mobileMenu="matMenu" class="mobile-dropdown-menu">
  <button mat-menu-item routerLink="/login">Login</button>
  <button mat-menu-item routerLink="/register">Register</button>
</mat-menu>
