<mat-toolbar color="primary" class="navbar">
  <!-- Hamburger icon for mobile -->
  <button mat-icon-button class="hamburger" [matMenuTriggerFor]="mobileMenu" aria-label="Open menu">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- Logo -->
  <a routerLink="/home" class="brand" aria-label="DocIT Home">
    <img src="assets/docit-logo.png" alt="DocIT logo" class="header-logo" />
    <span class="brand-text">DocIT</span>
  </a>

  <span class="spacer"></span>

  <!-- Right-side auth actions -->
  <div class="auth-actions">
    <button mat-button routerLink="/login" *ngIf="!isLoggedIn">Login</button>
    <button mat-button routerLink="/register" *ngIf="!isLoggedIn">Register</button>
    <button mat-icon-button class="profile-menu-btn" [class.profile-open]="profileMenuOpen" (click)="openProfileDialog()" *ngIf="isLoggedIn">
      <img [src]="profileImage" alt="Profile" class="profile-avatar" (error)="handleProfileImageError()">
    </button>
  </div>
</mat-toolbar>

<mat-menu #mobileMenu="matMenu" class="mobile-dropdown-menu">
  <button mat-menu-item routerLink="/login" *ngIf="!isLoggedIn">Login</button>
  <button mat-menu-item routerLink="/register" *ngIf="!isLoggedIn">Register</button>
  <button mat-menu-item (click)="openProfileDialog()" *ngIf="isLoggedIn">Profile</button>
</mat-menu>
