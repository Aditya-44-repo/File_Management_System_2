<div class="login-page">
  <mat-card class="auth-card">
    <div class="form-container">
      <div class="brand">
        <img class="brand-logo" src="assets/fileManagement-logo.png" alt="FileManagement logo" />

      </div>

      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to continue to your account</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <label class="input-label">Email / Username</label>
        <mat-form-field appearance="outline" class="full">
          <mat-icon matPrefix>person</mat-icon>
          <input matInput formControlName="login" placeholder="Enter your email or username" />
          <mat-error *ngIf="form.controls.login.invalid">Username or email is required</mat-error>
        </mat-form-field>

        <label class="input-label">Password</label>
        <mat-form-field appearance="outline" class="full">
          <mat-icon matPrefix>lock</mat-icon>
          <input matInput type="password" formControlName="password" placeholder="Enter your password" />
          <mat-error *ngIf="form.controls.password.invalid">Min length 6</mat-error>
        </mat-form-field>

        <div class="forgot-password-link">
          <a routerLink="/forgot-password">Forgot password?</a>
        </div>

        <button mat-raised-button color="primary" type="submit" class="sign-in-btn" [disabled]="loading || form.invalid">
          {{ loading ? 'Signing in…' : 'Sign In' }}
        </button>
      </form>

      <p class="register-link">Don't have an account? <a routerLink="/register">Sign up</a></p>
    </div>
  </mat-card>
</div>
