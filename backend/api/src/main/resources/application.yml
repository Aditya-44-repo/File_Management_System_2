spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: DocIT
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/file_load_mgmt?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  mail:
    host: ${MAIL_SMTP_HOST:smtp.gmail.com}
    port: ${MAIL_SMTP_PORT:587}
    username: ${MAIL_SMTP_USERNAME:}
    password: ${MAIL_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
          ssl:
            enable: ${MAIL_SMTP_SSL_ENABLE:false}
    from: ${MAIL_FROM:}
server:
  port: ${SERVER_PORT:8080}
  http:
    port: ${SERVER_HTTP_PORT:8082}
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  admin:
    email: ${ADMIN_EMAIL:admin@filemanagement.local}
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

# Note: HTTP is enabled for local backend access.
# If you need HTTPS locally, set SERVER_SSL_ENABLED=true and provide a valid keystore.
# Make sure to register both redirect URIs in Google Console for OAuth:
#   https://localhost:8080/login/oauth2/code/google
#   http://localhost:8082/login/oauth2/code/google
